<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Sorter</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta name="theme-color" content="#f6f5f0">
  <style>
    :root{--ink:#212a27;--muted:#78817b;--paper:#f6f5f0;--card:#fff;--line:#e8e9e3;--green:#37755c;--love:#e88977;--maybe:#e5bd58;--skip:#8494a4;--gray:#e2e4df}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    .shell{max-width:880px;margin:auto;padding:34px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:14px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}.top small{color:var(--muted)}.top{gap:10px}#refresh{padding:10px 18px;min-height:42px;white-space:nowrap;flex:0 0 auto}
    .progress-wrap{margin-bottom:28px}.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px}.bar{height:10px;border-radius:20px;background:var(--gray);overflow:hidden;display:flex}.seg{height:100%;transition:width .3s ease}.seg.love{background:var(--love)}.seg.maybe{background:var(--maybe)}.seg.skip{background:var(--skip)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 35px #24372d0a}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:12px}.title{font-size:clamp(27px,5vw,42px);line-height:1.13;letter-spacing:-.035em;margin:0 0 9px}.artist{font-size:18px;color:var(--muted);margin-bottom:24px}.spotify{display:block;width:100%;height:152px;border:0;border-radius:12px;background:#f4f4f4;margin:0 0 25px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid var(--line);background:white;border-radius:13px;padding:15px 10px;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;transition:transform .15s,border-color .15s,background .15s}.choice:hover{transform:translateY(-2px)}.choice.love:hover{border-color:var(--love);background:#fff8f6}.choice.maybe:hover{border-color:var(--maybe);background:#fffdf5}.choice.skip:hover{border-color:var(--skip);background:#f7f9fb}.hint{text-align:center;color:var(--muted);font-size:12px;margin:15px 0 0}.notice{padding:22px;background:#fff8e7;border:1px solid #f0dfb1;border-radius:14px;color:#61532f}.notice input{display:block;margin-top:12px}.subtle{color:var(--muted);font-size:13px}.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px;cursor:pointer;font:inherit;font-weight:650}.action.primary{background:var(--green);border-color:var(--green);color:white}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 27px}.pill{background:var(--paper);padding:8px 12px;border-radius:99px;font-size:13px}.group{margin-top:22px}.group h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 9px}.track{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.track strong{font-weight:650}.track span{color:var(--muted);font-size:13px;text-align:right}.hidden{display:none!important}
    .nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.nav-row .hint{flex:1}.action:disabled{opacity:.4;cursor:default}.choice.selected{box-shadow:inset 0 0 0 1px currentColor}
    body{background-image:radial-gradient(ellipse at 8% 8%,#fce3d3 0,transparent 32%),radial-gradient(ellipse at 95% 48%,#deeddb 0,transparent 27%)}
    .card{box-shadow:0 18px 55px #24372d12}.choice{transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}.choice:hover{transform:translateY(-3px);box-shadow:0 8px 18px #24372d14}.choice.love:hover,.choice.love.selected{border-color:var(--love);background:#fff0ed}.choice.maybe:hover,.choice.maybe.selected{border-color:var(--maybe);background:#fff8df}.choice.skip:hover,.choice.skip.selected{border-color:var(--skip);background:#eef3ff}
    @media(max-width:580px){.shell{padding:22px 14px 40px}.top{margin-bottom:22px}.controls{grid-template-columns:1fr;gap:9px}.choice{padding:14px}.report-head{display:block}.actions{margin-top:16px}.spotify{height:152px}.nav-row{align-items:flex-start}.nav-row .hint{text-align:right}}
.playlist-link{font-size:12px;color:var(--green);text-decoration:none;font-weight:700;margin-left:auto;margin-right:16px}.playlist-link:hover{text-decoration:underline}
    .group{margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-radius:16px}.group.love{background:#fff0ed;border-color:#f2c9c1}.group.maybe{background:#fff8df;border-color:#eedc9f}.group.skip{background:#eef3ff;border-color:#cfdaf3}.group h3{margin-bottom:10px}.group.love h3{color:#b95042}.group.maybe h3{color:#96700e}.group.skip h3{color:#4e699d}.group .track{border-color:#00000010}.pill.love{background:#fbe1dc;color:#9d4034}.pill.maybe{background:#f8edc4;color:#80600a}.pill.skip{background:#dfe8fb;color:#455d8b}
  </style>
</head>
<body>
  <main class="shell">
<header class="top"><div class="brand">Song Sorter</div><a class="playlist-link hidden" id="playlistLink" target="_blank" rel="noopener">Open playlist</a><small id="countLabel">Loading your songs...</small><button class="action" id="refresh" type="button">Refresh</button></header>
    <section class="progress-wrap" aria-label="Listening progress"><div class="progress-label"><span id="progressText">0 of 0 sorted</span><span id="leftText"></span></div><div class="bar" id="bar"></div></section>
    <section class="card" id="mainCard"><div class="subtle">Loading songsâ€¦</div></section>
  </main>
<script>
const choices=[{key:'love',label:'Love to listen'},{key:'maybe',label:'Do not mind to listen'},{key:'skip',label:'Skip it'}];
// The Settings sheet can override this default date (YYYY-MM-DD).
const DEFAULT_MUSIC_ADDED_AFTER = '2000-01-01';
const PUBLISHED_SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0yTT9rvP_Ur2tw2jnpqGQ-hJiDtblzERh-NupPDeJvVXz4ECD-klXPNf3832nHLSeIkz7_TTscSoa';
// Paste the published CSV link for the Settings tab here. It must include that tab's gid.
const SETTINGS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0yTT9rvP_Ur2tw2jnpqGQ-hJiDtblzERh-NupPDeJvVXz4ECD-klXPNf3832nHLSeIkz7_TTscSoa/pub?gid=1940387025&single=true&output=csv';
let musicAddedAfter = DEFAULT_MUSIC_ADDED_AFTER;
let playlistId = '', playlistUrl = '';
let settingsCutoffLoaded = false;
let songs=[],answers={},position=0;
const card=document.querySelector('#mainCard');
document.querySelector('#refresh').addEventListener('click',()=>location.reload());

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateProgress(){const done=Object.keys(answers).length,total=songs.length;document.querySelector('#progressText').textContent=`${done} of ${total} sorted`;document.querySelector('#leftText').textContent=`${total-done} left`;document.querySelector('#countLabel').textContent=`${total} songs since ${toISODate(musicAddedAfter)||DEFAULT_MUSIC_ADDED_AFTER}`;let html='';for(const c of choices){const n=Object.values(answers).filter(x=>x===c.key).length;html+=`<div class="seg ${c.key}" style="width:${total?n/total*100:0}%"></div>`}html+=`<div class="seg" style="background:var(--gray);width:${total?(total-done)/total*100:100}%"></div>`;document.querySelector('#bar').innerHTML=html}
function current(){if(position>=songs.length){renderReport();return}const s=songs[position],selected=answers[s.id];card.innerHTML=`<div class="eyebrow">Song ${position+1} of ${songs.length}${selected?' - choice saved':''}</div><h1 class="title">${safe(s.song)}</h1><div class="artist">${safe(s.artist)}</div><iframe class="spotify" src="https://open.spotify.com/embed/track/${encodeURIComponent(s.spotify)}?utm_source=generator&theme=0" title="Listen to ${safe(s.song)} by ${safe(s.artist)}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><div class="controls">${choices.map(c=>`<button class="choice ${c.key} ${selected===c.key?'selected':''}" data-choice="${c.key}" aria-pressed="${selected===c.key}">${c.label}${selected===c.key?' (selected)':''}</button>`).join('')}</div><div class="nav-row"><button class="action" id="back" ${position===0?'disabled':''}>&lt; Back</button><p class="hint">${selected?'Choice saved. Pick another to change it.':'Choose one to move to the next song'}</p></div>`;document.querySelector('#back').onclick=()=>{if(position>0){position--;updateProgress();current()}};card.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{answers[s.id]=b.dataset.choice;position++;updateProgress();current()}))}
function renderReport(){updateProgress();const names={love:'Love to listen',maybe:'Do not mind to listen',skip:'Skip it'};const groups=choices.map(c=>{const list=songs.filter(s=>answers[s.id]===c.key);return `<section class="group ${c.key}"><h3>${names[c.key]} - ${list.length}</h3>${list.length?list.map(s=>`<div class="track"><strong>${safe(s.song)}</strong><span>${safe(s.artist)}</span></div>`).join(''):'<div class="subtle">No songs in this group</div>'}</section>`}).join('');card.innerHTML=`<div class="report-head"><div><div class="eyebrow">All done</div><h1 class="title">Your listening report</h1><div class="subtle">${songs.length} songs sorted. Copy or extract your report as CSV.</div></div><div class="actions"><button class="action" id="copy">Copy CSV</button><button class="action primary" id="download">Extract CSV</button></div></div><div id="reportFeedback" class="subtle" aria-live="polite"></div><div class="stats">${choices.map(c=>`<span class="pill ${c.key}">${names[c.key]}: ${Object.values(answers).filter(x=>x===c.key).length}</span>`).join('')}</div>${groups}`;document.querySelector('#copy').onclick=async()=>{const button=document.querySelector('#copy');try{await copyTextToClipboard(reportCSV());button.textContent='Copied!';document.querySelector('#reportFeedback').textContent='CSV copied to clipboard.'}catch(error){button.textContent='Copy unavailable';document.querySelector('#reportFeedback').textContent='Clipboard access is unavailable here. Use Extract CSV to save the report.'}};document.querySelector('#download').onclick=extractReport}
async function copyTextToClipboard(text){if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(text);return}catch(error){}}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw Error('Clipboard copy failed')}
function reportFilename(){const d=new Date(),p=n=>String(n).padStart(2,'0'),timestamp=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`,id=String(playlistId||'unknown-playlist').replace(/[^a-zA-Z0-9_-]/g,'');return `my-listening-report_${timestamp}_${id}.csv`}
function downloadCSV(csv,filename=reportFilename()){const feedback=document.querySelector('#reportFeedback');let url='';try{const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();if(feedback)feedback.textContent=`Download started: ${filename}. Check your Downloads folder.`;setTimeout(()=>URL.revokeObjectURL(url),60000);return true}catch(error){if(url)URL.revokeObjectURL(url);if(feedback)feedback.textContent=`Could not save the CSV: ${error.message||error}`;return false}}function getCapacitorPlugin(name){const cap=window.Capacitor;return cap?.Plugins?.[name]||window.CapacitorPlugins?.[name]||null}
async function extractReport(){const csv=reportCSV(),filename=reportFilename(),feedback=document.querySelector('#reportFeedback'),nativeSave=getCapacitorPlugin('SaveFile');if(nativeSave&&typeof nativeSave.saveFile==='function'){try{await nativeSave.saveFile({fileName:filename,data:csv,mimeType:'text/csv'});feedback.textContent=`Saved ${filename}.`;return}catch(error){feedback.textContent=`Could not save the CSV: ${error.message||error}`;return}}if(typeof window.showSaveFilePicker==='function'){try{const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'CSV file',accept:{'text/csv':['.csv']}}]});const writable=await handle.createWritable();await writable.write(new Blob([csv],{type:'text/csv;charset=utf-8'}));await writable.close();feedback.textContent=`Saved ${filename}.`;return}catch(error){if(error&&error.name==='AbortError'){feedback.textContent='Save cancelled.';return}feedback.textContent=`Could not save the CSV: ${error.message||error}`;return}}if(window.Capacitor){feedback.textContent='Save location picker is unavailable in this Capacitor build. Add a native SaveFile plugin that opens Android’s Create Document dialog, then rebuild the app.';return}downloadCSV(csv,filename)}function csvCell(value){return '"'+String(value??'').replace(/"/g,'""')+'"'}
function reportCSV(){const rows=[['Choice','Song','Artist']];for(const c of choices)for(const s of songs)if(answers[s.id]===c.key)rows.push([c.label,s.song,s.artist]);return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'}
function normalizeKey(value){return String(value||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function toISODate(value){if(!value)return '';const s=String(value).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const us=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(us)return `${us[3]}-${us[1].padStart(2,'0')}-${us[2].padStart(2,'0')}`;if(/^\d+(\.\d+)?$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+Number(s)*86400000);return d.toISOString().slice(0,10)}const d=new Date(s);return Number.isNaN(d.valueOf())?'':d.toISOString().slice(0,10)}
function readSettings(text){const rows=parseCSV(text);if(!rows.length)return;const aliases={playlistid:['playlistid'],playlisturl:['playlisturl'],addedafter:['addedatcriteria','addedatcarteria','addedatcareteria','addedatcriterion','addedafter','addedat']};const nr=rows.map(row=>row.map(normalizeKey)),header=nr[0]||[],allAliases=Object.values(aliases).flat(),hasWideHeader=header.filter(h=>allAliases.includes(h)).length>1;for(const [key,names] of Object.entries(aliases)){let value='';if(hasWideHeader){const ci=header.findIndex(h=>names.includes(h));if(ci>=0&&rows[1])value=(rows[1][ci]||'').trim()}else for(let ri=0;ri<rows.length&&!value;ri++){const ci=nr[ri].findIndex(cell=>names.includes(cell));if(ci<0)continue;const right=(rows[ri][ci+1]||'').trim();if(right&&!allAliases.includes(normalizeKey(right)))value=right;else if(rows[ri+1]&&rows[ri+1][ci]){const below=(rows[ri+1][ci]||'').trim();if(!allAliases.includes(normalizeKey(below)))value=below}}if(key==='playlistid')playlistId=value;if(key==='playlisturl')playlistUrl=value;if(key==='addedafter'){const parsedDate=toISODate(value);if(parsedDate){musicAddedAfter=parsedDate;settingsCutoffLoaded=true}}}if(!playlistUrl&&playlistId)playlistUrl='https://open.spotify.com/playlist/'+encodeURIComponent(playlistId);const link=document.querySelector('#playlistLink');if(playlistUrl){link.href=playlistUrl;link.classList.remove('hidden')}}
async function fetchSheet(name){const urls=[];if(name==='Settings'&&SETTINGS_CSV_URL.trim())urls.push(SETTINGS_CSV_URL.trim());urls.push(`${PUBLISHED_SHEET_BASE}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`,`${PUBLISHED_SHEET_BASE}/pub?output=csv&sheet=${encodeURIComponent(name)}`);if(name==='Data')urls.push(`${PUBLISHED_SHEET_BASE}/pub?output=csv`);let lastError;for(const url of urls){try{const freshURL=url+(url.includes('?')?'&':'?')+'_='+Date.now();const response=await fetch(freshURL,{cache:'no-store'});if(response.ok)return await response.text();lastError=Error(`Sheet request failed (${response.status})`)}catch(error){lastError=error}}throw lastError||Error('Could not fetch sheet '+name)}
function loadCSV(text){const rows=parseCSV(text);if(!rows.length)throw Error('The published Data sheet is empty.');const header=rows.shift().map(x=>x.trim());const find=(...names)=>names.map(n=>header.findIndex(h=>h.toLowerCase()===n.toLowerCase())).find(i=>i>=0);const si=find('Song','Track'),ai=find('Artist'),ti=find('Spotify Track Id','Track ID','Spotify ID'),ni=find('#','Number'),di=find('Added At','Date Added','Added');if(si<0||ai<0||ti<0)throw Error('The Data sheet needs Song, Artist, and Spotify Track Id columns.');if(di<0)throw Error('The Data sheet needs an Added At date column so the Settings cutoff can be applied.');const cutoff=new Date((toISODate(musicAddedAfter)||DEFAULT_MUSIC_ADDED_AFTER)+'T00:00:00Z');songs=rows.filter(r=>r[si]&&r[ai]&&r[ti]&&toISODate(r[di])&&new Date(toISODate(r[di])+'T00:00:00Z')>=cutoff).map((r,i)=>({id:r[ni]>=0&&r[ni]?r[ni]:String(i+1),song:r[si],artist:r[ai],spotify:r[ti]}));if(!songs.length)throw Error('No songs with Spotify track IDs were found on or after '+(toISODate(musicAddedAfter)||DEFAULT_MUSIC_ADDED_AFTER)+'.');position=0;updateProgress();current()}
async function start(){settingsCutoffLoaded=false;musicAddedAfter=DEFAULT_MUSIC_ADDED_AFTER;try{const results=await Promise.allSettled([fetchSheet('Data'),fetchSheet('Settings')]);if(results[1].status==='rejected')throw Error('Could not load the Settings sheet, so the Added At cutoff cannot be applied.');readSettings(results[1].value);if(!settingsCutoffLoaded)throw Error("No valid Added At Careteria date was found in Settings. Set SETTINGS_CSV_URL to the Settings tab's published CSV link, including its gid.");if(results[0].status==='rejected')throw Error('Could not load the published Data sheet. Check the published spreadsheet URL and sheet names.');loadCSV(results[0].value)}catch(err){card.innerHTML=`<div class="eyebrow">Published sheet unavailable</div><h1 class="title">Could not load the playlist</h1><p class="subtle">${safe(err.message)} This page needs an internet connection and a publicly published spreadsheet.</p><button class="action primary" id="retry">Try again</button>`;document.querySelector('#retry').onclick=start}}
document.addEventListener('keydown',e=>{if(!card.querySelector('[data-choice]'))return;const b=card.querySelector(`[data-choice="${({1:'love',2:'maybe',3:'skip'})[e.key]||''}"]`);if(b)b.click()});start();
</script>
</body>
</html>
